name: Atualizar Index HTML

# Dispara sempre que houver push na branch main ou manualmente
on:
  push:
    branches: [main]
  workflow_dispatch:  # permite rodar manualmente no GitHub

jobs:
  atualizar-index:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Pega o código do repositório
    - name: Checkout do repositório
      uses: actions/checkout@v3

    # 2️⃣ Configura Python
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"  # pode mudar para sua versão preferida

    # 3️⃣ Instala dependências se houver (opcional)
    - name: Atualizar pip
      run: |
        pip install --upgrade pip

    # 4️⃣ Roda o script generate_index.py
    - name: Gerar/Atualizar index.html
      run: |
        python generate_index.py

    # 5️⃣ Commit e push automático das alterações
    - name: Commit & Push alterações
      run: |
        git config --local user.name "GitHub Actions"
        git config --local user.email "actions@github.com"
        git add .
        git diff --quiet || git commit -m "Atualizar index.html via workflow"
        git push
