on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: auto-generate-index
  cancel-in-progress: true

jobs:
  generate-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate smart index
        run: python generate_index.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # garante branch atualizada
          git pull --rebase origin master

          # adiciona criações, alterações e remoções
          git add -A

          # evita commit vazio
          if ! git diff --cached --quiet; then
            git commit -m "Update... Automatic index.html (latest zip only)"
            git push origin master
          else
            echo "✔ Nenhuma mudança gerada pelo script"
          fi
